[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unlearn-audit"
version = "0.0.1"
description = "An adversarial auditor for machine unlearning — tries to disprove forgetting and outputs a calibrated forgetting score."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scikit-learn",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
# Figure generation only — NOT an auditor runtime dependency. Pinned because "the figures
# reproduce from the committed arrays" is part of the reproducibility claim.
#   pip install -e ".[paper]"   then   python paper/make_figures.py
paper = ["matplotlib==3.11.1"]

[tool.setuptools]
packages = ["unlearn_audit", "unlearn_audit.unlearn", "unlearn_audit.attacks", "unlearn_audit.audit", "unlearn_audit.llm", "unlearn_audit.experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
