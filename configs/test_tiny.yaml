# Ultra-tiny config for smoke tests: MNIST, a handful of samples, 1 epoch, CPU. Seconds.
# Exercises the full multi-method + calibration path without any big download.
seed: 0
device: cpu

dataset:
  name: mnist
  root: ./data
  num_train: 200
  num_test: 100
  forget_size: 40
  batch_size: 64

model:
  arch: small_cnn

train:
  epochs: 1
  lr: 0.001

methods:
  - gradient_ascent
  - guardrail

unlearn:
  gradient_ascent:
    epochs: 1
    lr: 0.0005
    retain_reg: true
  guardrail: {}

gold:
  enabled: true
  epochs: 1
  lr: 0.001

calibration:
  n_boot: 20
  target_far: 0.05

attacks:
  - loss_mia

audit:
  aggregate: max
