# v0 default config. CIFAR-10 with a natural train/test gap so loss-MIA has real signal.
# Bump epochs if the gap (and thus the baseline/guardrail MIA-AUC) comes out too small.

seed: 0
device: auto            # auto | cpu | cuda

dataset:
  name: cifar10         # config knob: cifar10 (default) | mnist (fast smoke only)
  root: ./data
  num_train: 5000       # training pool (retain + forget); modest -> natural overfit gap
  num_test: 2000        # held-out non-members (MIA negative class)
  forget_size: 500      # designated "to forget" (MIA members)
  batch_size: 128

model:
  arch: small_cnn

train:                  # baseline training on the full pool
  epochs: 30
  lr: 0.001

methods:                # unlearning methods to audit — one labeled case each
  - gradient_ascent     #   honest but crude (should land between gold and guardrail)
  - guardrail           #   fake output filter, weights intact (should be caught)

unlearn:                # per-method hyperparameters
  gradient_ascent:
    epochs: 2           # crude on purpose; just not enough to fully collapse utility
    lr: 0.0005
    retain_reg: true
  guardrail: {}         # no hyperparameters — wraps the frozen baseline

gold:                   # gold reference = retrain on retain-only (ideal forgetting + null source)
  enabled: true
  epochs: 30
  lr: 0.001

calibration:
  n_boot: 200           # bootstrap resamples off the gold model for the null distribution
  target_far: 0.05      # desired false-alarm rate

attacks:
  - loss_mia            # registry keys; add more here as we implement them

audit:
  aggregate: max        # model fails if ANY attack recovers info -> aggregate = max

multiseed:              # used by `python -m unlearn_audit.multiseed`
  seeds: [0, 1, 2, 3, 4]
